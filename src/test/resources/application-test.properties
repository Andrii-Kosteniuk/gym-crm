# Isolated in-memory database for Spring Core integration tests.
db.url=jdbc:h2:mem:gym_crm_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
db.username=sa
db.password=
db.pool.maximum-size=5
db.pool.minimum-idle=1
flyway.locations=classpath:db/migration/h2
hibernate.hbm2ddl.auto=validate
hibernate.show_sql=false
hibernate.format_sql=false
